[package]
name = "em-cas"
version = "0.1.0"
edition = "2021"
description = "Content-addressed store of 4 KiB pages: zero / exact dedup / XOR-delta / temporal delta, relocatable OS segments."

[dependencies]
sha2 = { version = "0.10", default-features = false }
lz4_flex = { version = "0.11", default-features = false, features = ["safe-encode", "safe-decode"] }
