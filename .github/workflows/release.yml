name: release
# Собирает Windows-сборку приложения на нативном раннере и прикрепляет её к GitHub Release.
# Триггер — пуш тега вида v0.38.0 (или ручной запуск с указанием тега).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег для (пере)сборки, например v0.38.0'
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Тесты (должны пройти до публикации)
        shell: pwsh
        run: |
          dotnet run --project tests/ElasticMem.Tests -c Release 2>&1 | Tee-Object core-tests.log
          if ($LASTEXITCODE -ne 0 -or -not (Select-String -Path core-tests.log -Pattern 'ALL TESTS PASSED' -Quiet)) { throw 'tests failed' }
      - name: Публикация приложения (win-x64, self-contained, single-file)
        shell: pwsh
        run: |
          $sha = git rev-parse HEAD
          dotnet publish src/ElasticMem.App -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true "-p:SourceRevisionId=$sha" -o pkg/ElasticMem
          if ($LASTEXITCODE -ne 0) { throw 'publish failed' }
          Get-ChildItem pkg -Recurse -Filter *.pdb | Remove-Item -ErrorAction SilentlyContinue
      - name: Сборка пакета
        shell: pwsh
        run: |
          $p = 'pkg/ElasticMem'
          [IO.File]::WriteAllText("$p/НАЧНИТЕ-ЗДЕСЬ.txt", "ElasticMem $env:TAG`r`n`r`nРаспакуйте ВСЮ папку и запустите ElasticMem.exe (self-contained, .NET ставить не нужно).`r`nОдна кнопка освобождает память; раздел «Проверка → Дедуп» меряет дедупликацию.`r`n", [Text.UTF8Encoding]::new($true))
          $zip = "ElasticMem-$env:TAG-win-x64.zip"
          Compress-Archive -Path $p -DestinationPath $zip
          (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower() + "  $zip" | Set-Content -Encoding ASCII "$zip.sha256"
          "ZIP=$zip" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ElasticMem ${{ env.TAG }}
          prerelease: true
          body: |
            Рабочая сборка приложения ElasticMem для Windows 10/11 (x64, self-contained).

            Распакуйте весь архив и запустите `ElasticMem.exe` — .NET ставить не нужно.
            Проверка целостности: см. `.sha256`.

            Это приложение освобождает память штатными средствами Windows и показывает, насколько
            память сжимается; раздел «Проверка → Дедуп» меряет кросс-процессную дедупликацию и
            содержит нативный самотест дедуп-кучи. Драйвер/VMM в сборку не входят.
          files: |
            ${{ env.ZIP }}
            ${{ env.ZIP }}.sha256
