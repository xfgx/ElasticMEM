name: driver-build
# Собирает ElasticMemStore.sys нативно на Windows-раннере тулсетом WDK (он уже есть в образе windows-2022).
# Драйвер НЕ подписывается и НЕ загружается здесь — только сборка + выгрузка .sys и логов артефактом.
on:
  workflow_dispatch:
  push:
    paths: ['driver/**', '.github/workflows/driver-build.yml']
permissions:
  contents: read
jobs:
  build-driver:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Inventory WDK + build driver
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          $km = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\Include\*\km' -Directory -ErrorAction SilentlyContinue | ForEach-Object { $_.Parent.Name }
          "wdk_km_headers=$($km -join ',')" | Tee-Object evidence/wdk-inventory.txt
          $ver = ($km | Sort-Object | Select-Object -Last 1)
          if (-not $ver) { "No WDK kernel headers on this runner image." | Tee-Object evidence/driver-build.log; exit 1 }
          # Тулсет драйвера сам выбирает совместимый компилятор; НЕ подмешиваем msvc-dev-cmd.
          msbuild driver\kmdf\ElasticMemStore.vcxproj /m /t:Rebuild /p:Configuration=Release /p:Platform=x64 "/p:WindowsTargetPlatformVersion=$ver" 2>&1 | Tee-Object evidence/driver-build.log
          if ($LASTEXITCODE -ne 0) { "`nMSBuild exit $LASTEXITCODE" | Tee-Object -Append evidence/driver-build.log; exit 1 }
          $sys = Get-ChildItem driver\out -Recurse -Filter ElasticMemStore.sys -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $sys) { "Build OK but .sys not found" | Tee-Object -Append evidence/driver-build.log; exit 1 }
          (Get-FileHash $sys.FullName -Algorithm SHA256).Hash | Tee-Object evidence/driver-sha256.txt
          Copy-Item $sys.FullName evidence\ElasticMemStore.sys
          "Built UNSIGNED (not loadable without signing): $($sys.FullName)" | Tee-Object -Append evidence/driver-build.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: driver-build-evidence
          path: evidence/
          if-no-files-found: warn
