name: qemu-whpx-kit
# Набор для проверки на вашем ПК: немодифицированный QEMU для Windows (сборка Stefan Weil, хеш закреплён) +
# прокси WinHvPlatform.dll с em-pager + em-pagestat + probe.exe + скрипты. На раннерах GitHub нет вложенной
# виртуализации, поэтому гостя здесь не запустить: проверяется, что QEMU стартует с урезанным набором DLL,
# действительно грузит прокси из своей папки, а скрипты набора разбираются PowerShell без ошибок.
on:
  workflow_dispatch:
  push:
    branches: ['claude/cas-memory']
    paths: ['vm/qemu-whpx/**', 'rust/em-whp-proxy/src/**', 'rust/em-pager/src/**', 'rust/em-cas/src/**', 'rust/em-pagestat/src/**', '.github/workflows/qemu-whpx-kit.yml']
permissions:
  contents: write
env:
  QEMU_SETUP: qemu-w64-setup-20260811.exe
  QEMU_SHA512: 5bcf9eed634e8575a37b74f445af41a2fe4106da512d0c30c368301d4c105037fdfab40a5287367a28a957624cddebbc8c07e16c88ab6634f554cdf3d16bf543
jobs:
  kit:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build proxy, em-pagestat, probe.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out, kit | Out-Null
          cargo build --release --manifest-path rust/Cargo.toml -p em-whp-proxy -p em-pagestat; if ($LASTEXITCODE -ne 0) { throw "cargo build failed" }
          Copy-Item rust/target/release/WinHvPlatform.dll, rust/target/release/em-pagestat.exe kit/
          cl /nologo /O2 /W3 research\active-trim\probe.c /Fe:kit\probe.exe psapi.lib winmm.lib advapi32.lib | Out-Null; if ($LASTEXITCODE -ne 0) { throw "cl probe.c failed" }
          cl /nologo /O2 rust\em-whp-proxy\test\whp_selftest.c /Fe:kit\whp-selftest.exe | Out-Null; if ($LASTEXITCODE -ne 0) { throw "cl whp_selftest.c failed" }
          if (-not (Test-Path kit\whp-selftest.exe)) { throw "whp-selftest build failed" }
          dumpbin /exports kit\WinHvPlatform.dll | Tee-Object out/proxy-exports.txt | Out-Null
          foreach ($s in 'WHvMapGpaRange', 'WHvUnmapGpaRange', 'WHvRunVirtualProcessor', 'WHvGetCapability', 'WHvGetVirtualProcessorCpuidOutput') { if (-not (Select-String -Path out/proxy-exports.txt -Pattern "\b$s\b" -Quiet)) { throw "missing export $s" } }
      - name: Fetch QEMU for Windows (pinned SHA-512) and keep only what is needed
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://qemu.weilnetz.de/w64/$env:QEMU_SETUP" -OutFile q.exe
          $h = (Get-FileHash q.exe -Algorithm SHA512).Hash.ToLower()
          "sha512=$h" | Tee-Object out/qemu-download.txt
          if ($h -ne $env:QEMU_SHA512) { throw "QEMU installer hash mismatch" }
          & "C:\Program Files\7-Zip\7z.exe" x -y -oqx q.exe | Out-Null
          New-Item -ItemType Directory -Force kit/qemu/share | Out-Null
          # исполняемые файлы и транзитивно нужные им DLL из комплекта (по таблице импорта)
          $need = New-Object System.Collections.Generic.HashSet[string]
          $todo = New-Object System.Collections.Generic.Stack[string]
          'qemu-system-x86_64.exe', 'qemu-img.exe' | ForEach-Object { $todo.Push($_) }
          while ($todo.Count) {
            $f = $todo.Pop()
            if (-not $need.Add($f.ToLower())) { continue }
            $deps = dumpbin /dependents "qx\$f" | Where-Object { $_ -match '^\s+(\S+\.dll)\s*$' } | ForEach-Object { $Matches[1] }
            foreach ($d in $deps) { if ((Test-Path "qx\$d") -and -not $need.Contains($d.ToLower())) { $todo.Push($d) } }
          }
          foreach ($f in $need) { Copy-Item "qx\$f" kit/qemu/ }
          foreach ($b in 'edk2-x86_64-code.fd', 'edk2-i386-vars.fd', 'bios-256k.bin', 'kvmvapic.bin', 'linuxboot_dma.bin', 'vgabios-stdvga.bin', 'efi-e1000e.rom', 'edk2-licenses.txt') { if (Test-Path "qx\share\$b") { Copy-Item "qx\share\$b" kit/qemu/share/ } }
          if (Test-Path qx\share\keymaps) { Copy-Item -Recurse qx\share\keymaps kit/qemu/share/ }
          foreach ($b in 'COPYING', 'COPYING.LIB') { if (Test-Path "qx\$b") { Copy-Item "qx\$b" kit/qemu/ } }
          @("QEMU for Windows, build by Stefan Weil: https://qemu.weilnetz.de/w64/$env:QEMU_SETUP", "SHA-512 $env:QEMU_SHA512",
            'Source code: https://www.qemu.org/download/ (GPL-2.0, see COPYING). Only qemu-system-x86_64, qemu-img and the DLLs they import are included, unmodified.') | Set-Content kit/qemu/SOURCE.txt
          "files=$($need.Count)" | Tee-Object -Append out/qemu-download.txt
          Get-ChildItem kit/qemu | Measure-Object Length -Sum | ForEach-Object { "kit_qemu_mib=$([int]($_.Sum/1MB))" } | Tee-Object -Append out/qemu-download.txt
          & kit/qemu/qemu-system-x86_64.exe --version | Tee-Object out/qemu-version.txt
          & kit/qemu/qemu-system-x86_64.exe -accel help | Tee-Object -Append out/qemu-version.txt
      - name: QEMU starts with the trimmed DLL set (TCG) and loads the proxy from its folder (WHPX)
        shell: pwsh
        run: |
          $q = (Resolve-Path kit/qemu/qemu-system-x86_64.exe).Path
          $p = Start-Process -FilePath $q -ArgumentList @('-machine', 'q35', '-accel', 'tcg', '-m', '256', '-display', 'none', '-nodefaults', '-serial', 'none') -PassThru -RedirectStandardError out/qemu-tcg-err.txt
          Start-Sleep -Seconds 10
          $alive = -not $p.HasExited
          if ($alive) { Stop-Process -Id $p.Id -Force }
          "tcg_alive_after_10s=$alive" | Tee-Object out/qemu-start.txt
          if (-not $alive) { Get-Content out/qemu-tcg-err.txt; throw "QEMU did not start with the trimmed kit" }
          Copy-Item kit/WinHvPlatform.dll kit/qemu/
          $env:EM_WHP_PROXY_LOG = "$PWD\out\proxy-load.txt"
          $env:EM_PAGER = "1"
          & $q -machine q35 -accel whpx -m 256 -display none -nodefaults 2>&1 | Tee-Object -Append out/qemu-start.txt
          Remove-Item kit/qemu/WinHvPlatform.dll
          Get-Content out/proxy-load.txt -ErrorAction SilentlyContinue | Tee-Object -Append out/qemu-start.txt
          if (-not (Select-String -Path out/proxy-load.txt -Pattern 'EM_WHP_PROXY loaded' -Quiet)) { throw "QEMU did not load the proxy from its folder" }
          $global:LASTEXITCODE = 0 # QEMU с WHPX на раннере без виртуализации ожидаемо завершается с ошибкой
      - name: PowerShell syntax check of the kit
        shell: pwsh
        run: |
          $bad = 0
          $res = Get-ChildItem vm/qemu-whpx/kit -Recurse -Filter *.ps1 | ForEach-Object {
            $err = $null; [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$err) | Out-Null
            if ($err) { $script:bad++; "$($_.Name): $($err | Out-String)" } else { "$($_.Name): ok" }
          }
          $res | Tee-Object out/ps-syntax.txt
          if ($bad) { throw "syntax errors" }
      - name: Assemble kit
        shell: pwsh
        run: |
          Copy-Item -Recurse vm/qemu-whpx/kit/* kit/
          Copy-Item vm/qemu-whpx/README.md kit/README.md
          $z = "ElasticMem-QEMU-WHPX-kit.zip"
          Compress-Archive -Path kit/* -DestinationPath $z -CompressionLevel Optimal
          (Get-FileHash $z -Algorithm SHA256).Hash + "  " + $z + "  " + (Get-Item $z).Length | Tee-Object out/kit-sha256.txt
      - name: Prepare-Disk on a synthetic VHDX (real SYSTEM hive copy; offline registry edits verified)
        shell: pwsh
        run: |
          $v = "$env:RUNNER_TEMP\guest.vhdx"
          "create vdisk file=$v maximum=2048 type=expandable`nselect vdisk file=$v`nattach vdisk`ncreate partition primary`nformat fs=ntfs quick label=GUEST`nassign`ndetach vdisk" | Set-Content dp.txt -Encoding ascii
          diskpart /s dp.txt | Out-Null
          $img = Mount-DiskImage -ImagePath $v -StorageType VHDX -PassThru | Get-DiskImage
          $letter = (Get-Disk -Number $img.Number | Get-Partition | Where-Object DriveLetter | Select-Object -First 1).DriveLetter
          New-Item -ItemType Directory -Force "${letter}:\Windows\System32\config" | Out-Null
          reg.exe save HKLM\SYSTEM "${letter}:\Windows\System32\config\SYSTEM" /y | Out-Null
          reg.exe save HKLM\SOFTWARE "${letter}:\Windows\System32\config\SOFTWARE" /y | Out-Null
          New-Item -ItemType Directory -Force "${letter}:\Program Files (x86)\Microsoft\Edge\Application" | Out-Null
          Set-Content "${letter}:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe" 'stub' -Encoding ascii
          Dismount-DiskImage -ImagePath $v | Out-Null
          # «как в чужом госте»: выключить драйвер и RDP в копии куста, затем Prepare-Disk должен всё вернуть
          $img = Mount-DiskImage -ImagePath $v -StorageType VHDX -PassThru | Get-DiskImage
          $letter = (Get-Disk -Number $img.Number | Get-Partition | Where-Object DriveLetter | Select-Object -First 1).DriveLetter
          reg.exe load HKLM\EMT "${letter}:\Windows\System32\config\SYSTEM" | Out-Null
          $cs = 'HKLM:\EMT\ControlSet{0:D3}' -f (Get-ItemProperty HKLM:\EMT\Select).Current
          Set-ItemProperty "$cs\Services\storahci" -Name Start -Value 3
          Set-ItemProperty "$cs\Control\Terminal Server" -Name fDenyTSConnections -Value 1
          [gc]::Collect(); reg.exe unload HKLM\EMT | Out-Null
          Dismount-DiskImage -ImagePath $v | Out-Null
          powershell -NoProfile -ExecutionPolicy Bypass -File vm/qemu-whpx/kit/Prepare-Disk.ps1 -Vhdx $v 2>&1 | Tee-Object out/prepare-disk.txt
          $img = Mount-DiskImage -ImagePath $v -StorageType VHDX -PassThru | Get-DiskImage
          $letter = (Get-Disk -Number $img.Number | Get-Partition | Where-Object DriveLetter | Select-Object -First 1).DriveLetter
          reg.exe load HKLM\EMT "${letter}:\Windows\System32\config\SYSTEM" | Out-Null
          $cs = 'HKLM:\EMT\ControlSet{0:D3}' -f (Get-ItemProperty HKLM:\EMT\Select).Current
          $start = (Get-ItemProperty "$cs\Services\storahci").Start
          $deny = (Get-ItemProperty "$cs\Control\Terminal Server").fDenyTSConnections
          $bak = Test-Path "${letter}:\Windows\System32\config\SYSTEM.elasticmem.bak"
          [gc]::Collect(); reg.exe unload HKLM\EMT | Out-Null
          reg.exe load HKLM\EMTS "${letter}:\Windows\System32\config\SOFTWARE" | Out-Null
          $al = Get-ItemProperty 'HKLM:\EMTS\Microsoft\Windows NT\CurrentVersion\Terminal Server\TSAppAllowList' -ErrorAction SilentlyContinue
          $app = Get-ItemProperty 'HKLM:\EMTS\Microsoft\Windows NT\CurrentVersion\Terminal Server\TSAppAllowList\Applications\ElasticMem-Edge' -ErrorAction SilentlyContinue
          $disabledAllow = $al.fDisabledAllowList; $edgePath = $app.Path
          [gc]::Collect(); reg.exe unload HKLM\EMTS | Out-Null
          "verify fDisabledAllowList=$disabledAllow ElasticMem-Edge.Path=$edgePath" | Tee-Object -Append out/prepare-disk.txt
          if ($disabledAllow -ne 1 -or $edgePath -ne 'C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe') { throw "Prepare-Disk did not publish Edge for RemoteApp" }
          Dismount-DiskImage -ImagePath $v | Out-Null
          "verify storahci_start=$start fDenyTSConnections=$deny backup=$bak" | Tee-Object -Append out/prepare-disk.txt
          if ($start -ne 0 -or $deny -ne 0 -or -not $bak) { throw "Prepare-Disk did not apply the changes" }
          $global:LASTEXITCODE = 0
      - name: Run-All preflight from the assembled kit (no Hyper-V VMs on the runner — must finish gracefully)
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force kt -ErrorAction SilentlyContinue
          Expand-Archive ElasticMem-QEMU-WHPX-kit.zip -DestinationPath kt
          powershell -NoProfile -ExecutionPolicy Bypass -File kt/Run-All.ps1 -PreflightOnly 2>&1 | Tee-Object out/run-all-preflight.txt
          $z = Get-ChildItem ([Environment]::GetFolderPath('Desktop')), $env:USERPROFILE -Filter 'ElasticMem-report-*.zip' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $z) { throw "no report zip" }
          "report_zip=$($z.Name) bytes=$($z.Length)" | Tee-Object -Append out/run-all-preflight.txt
          if (-not (Select-String -Path out/run-all-preflight.txt -Pattern 'ИТОГ' -Quiet)) { throw "preflight did not finish" }
          $global:LASTEXITCODE = 0
      - uses: actions/upload-artifact@v4
        with: { name: ElasticMem-QEMU-WHPX-kit, path: ElasticMem-QEMU-WHPX-kit.zip }
      - name: Publish kit as prerelease
        shell: pwsh
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          $tag = "qemu-whpx-kit-${{ github.run_id }}"
          gh release create $tag ElasticMem-QEMU-WHPX-kit.zip --prerelease --target ${{ github.sha }} --title "ElasticMem QEMU/WHPX kit (run ${{ github.run_id }})" --notes "QEMU for Windows (Stefan Weil, $env:QEMU_SETUP, без изменений) + прокси WinHvPlatform.dll с em-pager. Проверка на ПК с включённой платформой Windows Hypervisor Platform. См. README.md в архиве." 2>&1 | Tee-Object out/release.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: qemu-kit-logs, path: out/ }
  commit:
    needs: kit
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: qemu-kit-logs, path: dl }
        continue-on-error: true
      - name: Commit kit logs back
        run: |
          mkdir -p vm/qemu-whpx/results; rm -f vm/qemu-whpx/results/*.txt
          cp dl/*.txt vm/qemu-whpx/results/ 2>/dev/null || true
          echo "run: ${{ github.run_id }} sha: ${{ github.sha }} result: ${{ needs.kit.result }}" > vm/qemu-whpx/results/RUN.txt
          git config user.name "qemu-whpx-kit"; git config user.email "actions@users.noreply.github.com"
          git add vm/qemu-whpx/results
          git commit -m "qemu-whpx-kit: logs of run ${{ github.run_id }}" || exit 0
          for i in 1 2 3; do git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && break; sleep 5; done
