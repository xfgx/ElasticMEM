name: windows-native
# Нативная проверка на Windows-раннере: сборка и тесты ядра приложения.
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Тесты ядра (должен быть маркер ALL TESTS PASSED)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          dotnet run --project tests/ElasticMem.Tests -c Release 2>&1 | Tee-Object evidence/core-tests.log
          if ($LASTEXITCODE -ne 0) { throw "tests failed" }
          if (-not (Select-String -Path evidence/core-tests.log -Pattern 'ALL TESTS PASSED' -Quiet)) { throw "no ALL TESTS PASSED marker" }
      - name: Сборка приложения (win-x64, self-contained)
        shell: pwsh
        run: dotnet publish src/ElasticMem.App -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -o pkg
      - uses: actions/upload-artifact@v4
        with:
          name: core-tests-log
          path: evidence/core-tests.log
